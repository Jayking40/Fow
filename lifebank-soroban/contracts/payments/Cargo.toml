[package]
name = "payment-contract"
version = "0.0.0"
edition = "2021"
publish = false

[lib]
crate-type = ["lib", "cdylib"]
doctest = false

[dependencies]
soroban-sdk = { workspace = true, features = ["alloc"] }

[dev-dependencies]
soroban-sdk = { workspace = true, features = ["testutils"] }

[features]
# Enables the full upgrade rehearsal test, which swaps in the real compiled
# WASM. Build the workspace WASMs first: scripts/test-upgrade-rehearsal.sh
upgrade-rehearsal = []
