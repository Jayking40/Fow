name: CI

on:
  push:
    branches: ['**']
  pull_request:
    branches: [refactor, main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '20'
  RUST_VERSION: 'stable'

jobs:
  # ── 1. Lint ──────────────────────────────────────────────────────────────────
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
        working-directory: backend
      - run: npm run lint
        working-directory: backend
      - run: npm run format:check
        working-directory: backend

  # ── 2. Unit tests (sharded) ──────────────────────────────────────────────────
  unit:
    name: Unit (shard ${{ matrix.shard }}/${{ matrix.total }})
    runs-on: ubuntu-latest
    needs: lint
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
        total: [4]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
        working-directory: backend
      - name: Run unit tests (shard ${{ matrix.shard }}/${{ matrix.total }})
        run: |
          npm test -- \
            --shard=${{ matrix.shard }}/${{ matrix.total }} \
            --coverage \
            --coverageDirectory=coverage/unit-${{ matrix.shard }}
        working-directory: backend
      - uses: actions/upload-artifact@v4
        with:
          name: unit-coverage-${{ matrix.shard }}
          path: backend/coverage/unit-${{ matrix.shard }}

  coverage-ratchet:
    name: Coverage ratchet
    runs-on: ubuntu-latest
    needs: unit
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: unit-coverage-*
          merge-multiple: true
          path: backend/coverage
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
        working-directory: backend
      - name: Merge and check coverage floor
        run: |
          npx nyc merge coverage coverage/merged.json
          npx nyc report --reporter=text-summary --temp-dir coverage --check-coverage \
            --branches 70 --lines 75 --functions 75 --statements 75
        working-directory: backend

  # ── 3. Integration tests (testcontainers) ────────────────────────────────────
  integration:
    name: Integration
    runs-on: ubuntu-latest
    needs: unit
    services: {}  # testcontainers starts its own Docker containers
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
        working-directory: backend
      - name: Run integration tests
        run: npm run test:integration
        working-directory: backend
        env:
          JWT_SECRET: ${{ secrets.JWT_SECRET || 'ci-test-secret' }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: integration-coverage
          path: backend/coverage/integration

  # ── 4. E2E journeys ──────────────────────────────────────────────────────────
  e2e:
    name: E2E journeys
    runs-on: ubuntu-latest
    needs: integration
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
        working-directory: backend
      - name: Run e2e journey suites
        run: npm run test:e2e
        working-directory: backend
        env:
          JWT_SECRET: ${{ secrets.JWT_SECRET || 'ci-test-secret' }}
        timeout-minutes: 15
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: e2e-artifacts
          path: |
            backend/test-results/
            backend/screenshots/

  # ── 5. Soroban contracts ─────────────────────────────────────────────────────
  contracts:
    name: Soroban contracts
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ env.RUST_VERSION }}
          targets: wasm32v1-none
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: lifebank-soroban
      - name: Clippy
        run: cargo clippy --all --all-features -- -D warnings
        working-directory: lifebank-soroban
      - name: Format check
        run: cargo fmt --all -- --check
        working-directory: lifebank-soroban
      - name: Tests
        run: cargo test --all
        working-directory: lifebank-soroban
      - name: Build WASMs
        run: bash scripts/build-all.sh
        working-directory: lifebank-soroban

  spec-drift:
    name: Spec drift check
    runs-on: ubuntu-latest
    needs: contracts
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ env.RUST_VERSION }}
          targets: wasm32v1-none
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: lifebank-soroban
      - name: Install stellar CLI
        run: cargo install stellar-cli --locked
      - name: Build WASMs
        run: bash scripts/build-all.sh
        working-directory: lifebank-soroban
      - name: Check spec drift
        run: |
          bash scripts/update-snapshots.sh
          git diff --exit-code spec-snapshots/
        working-directory: lifebank-soroban

  # ── 6. Nightly load tests ────────────────────────────────────────────────────
  load:
    name: Load tests (nightly)
    runs-on: ubuntu-latest
    needs: [e2e, contracts]
    if: github.event_name == 'push' && github.ref == 'refs/heads/refactor'
    steps:
      - uses: actions/checkout@v4
      - name: Install k6
        run: |
          sudo gpg -k
          sudo gpg --no-default-keyring --keyring /usr/share/keyrings/k6-archive-keyring.gpg \
            --keyserver hkp://keyserver.ubuntu.com:80 --recv-keys C5AD17C747E3415A3642D57D77C6C491D6AC1D69
          echo "deb [signed-by=/usr/share/keyrings/k6-archive-keyring.gpg] https://dl.k6.io/deb stable main" \
            | sudo tee /etc/apt/sources.list.d/k6.list
          sudo apt-get update && sudo apt-get install -y k6
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
        working-directory: backend
      - name: Start app (background)
        run: npm run start:prod &
        working-directory: backend
        env:
          DATABASE_URL: ${{ secrets.CI_DATABASE_URL }}
          REDIS_URL: ${{ secrets.CI_REDIS_URL }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
      - name: Wait for app ready
        run: |
          until curl -sf http://localhost:3000/health; do sleep 2; done
        timeout-minutes: 2
      - name: k6 — matching contention
        run: k6 run --env BASE_URL=http://localhost:3000 test/load/matching-contention.js
        working-directory: backend
      - name: k6 — telemetry ingest
        run: k6 run --env BASE_URL=http://localhost:3000 test/load/telemetry-ingest.js
        working-directory: backend
      - name: k6 — WebSocket fanout
        run: k6 run --env BASE_URL=http://localhost:3000 test/load/websocket-fanout.js
        working-directory: backend
      - name: k6 — USSD callback
        run: k6 run --env BASE_URL=http://localhost:3000 test/load/ussd-callback.js
        working-directory: backend
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: k6-results
          path: backend/k6-results/

  # ── Flaky quarantine ─────────────────────────────────────────────────────────
  flaky-quarantine:
    name: Flaky test quarantine
    runs-on: ubuntu-latest
    needs: e2e
    if: failure()
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: e2e-artifacts
          path: e2e-artifacts
      - name: Label flaky tests
        run: |
          echo "E2E failure detected — check e2e-artifacts/ for screenshots and logs."
          echo "If this is a known flaky test, add it to .jest-quarantine.json to suppress."
          exit 0  # Don't fail the quarantine job itself
