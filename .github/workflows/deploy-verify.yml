name: Build & Verify Deployment
name: Build & Verify Deployment

# Canonical contract stack is the `lifebank-soroban/` workspace (ADR-0001).
# The legacy `healthchain` monolith under `legacy/contracts/` is intentionally
# excluded from CI — its tests stay runnable locally (`cd legacy/contracts &&
# cargo test`) only as a port reference.

on:
  push:
    branches: [main, develop]
    paths:
      - 'lifebank-soroban/contracts/**'
      - 'lifebank-soroban/Cargo.toml'
      - 'lifebank-soroban/Cargo.lock'
      - 'lifebank-soroban/deployments/**'
      - '.github/workflows/deploy-verify.yml'
  pull_request:
    paths:
      - 'lifebank-soroban/contracts/**'
      - 'lifebank-soroban/Cargo.toml'
      - 'lifebank-soroban/Cargo.lock'
  workflow_dispatch:
    inputs:
      network:
        description: 'Network lockfile to verify against (local|testnet|mainnet)'
        required: false
        default: 'testnet'

env:
  RUST_VERSION: '1.81.0'
  STELLAR_CLI_VERSION: '21.4.0'
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: '0'

jobs:
  # ── Job 1: Unit tests ────────────────────────────────────────────────────────
  test:
    name: Unit Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: lifebank-soroban
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain (pinned)
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ env.RUST_VERSION }}
          targets: wasm32v1-none

      - name: Cache Cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            lifebank-soroban/target
          key: cargo-${{ env.RUST_VERSION }}-${{ hashFiles('lifebank-soroban/Cargo.lock') }}
          restore-keys: cargo-${{ env.RUST_VERSION }}-

      - name: Run unit tests
        run: cargo test --all
  # ── Job 1b: Event catalog coverage ────────────────────────────────────────
  event-catalog:
    name: Event Catalog Coverage
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: lifebank-soroban
    steps:
      - uses: actions/checkout@v4

      - name: Diff EVENTS.md against emitted events
        run: bash scripts/check-event-catalog.sh
  # ── Job 2: Reproducible build ─────────────────────────────────────────────
  build:
    name: Reproducible Build
    runs-on: ubuntu-latest
    needs: test
    defaults:
      run:
        working-directory: lifebank-soroban
    outputs:
      hashes: ${{ steps.hashes.outputs.hashes }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain (pinned)
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ env.RUST_VERSION }}
          targets: wasm32v1-none

      - name: Install binaryen (wasm-opt)
        run: sudo apt-get install -y --no-install-recommends binaryen

      - name: Install stellar-cli (pinned)
        run: cargo install --locked stellar-cli@${{ env.STELLAR_CLI_VERSION }}

      - name: Cache Cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            lifebank-soroban/target
          key: cargo-wasm-${{ env.RUST_VERSION }}-${{ hashFiles('lifebank-soroban/Cargo.lock') }}
          restore-keys: cargo-wasm-${{ env.RUST_VERSION }}-

      - name: Build WASMs (deterministic)
        env:
          SOURCE_DATE_EPOCH: '0'
        run: |
          cargo build --release --target wasm32v1-none
          for wasm in target/wasm32v1-none/release/*_contract.wasm; do
            [ -f "$wasm" ] || continue
            stellar contract optimize --wasm "$wasm" || true
          done

      - name: Compute SHA-256 hashes
        id: hashes
        run: |
          echo "=== WASM SHA-256 hashes ==="
          hash_output=""
          for wasm in target/wasm32v1-none/release/*.wasm; do
            [ -f "$wasm" ] || continue
            h=$(sha256sum "$wasm" | awk '{print $1}')
            name=$(basename "$wasm")
            echo "  $h  $name"
            hash_output="${hash_output}${name}:${h},"
          done
          echo "hashes=${hash_output}" >> "$GITHUB_OUTPUT"

      - name: Upload WASM artifacts
        uses: actions/upload-artifact@v4
        with:
          name: wasm-artifacts-${{ github.sha }}
          path: lifebank-soroban/target/wasm32v1-none/release/*.wasm
          retention-days: 30

  # ── Job 3: Hash verification against lockfiles ────────────────────────────
  verify-hashes:
    name: Verify WASM Hashes vs Lockfiles
    runs-on: ubuntu-latest
    needs: build
    defaults:
      run:
        working-directory: lifebank-soroban
    strategy:
      fail-fast: false
      matrix:
        network: [testnet, mainnet]
    steps:
      - uses: actions/checkout@v4

      - name: Download WASM artifacts
        uses: actions/download-artifact@v4
        with:
          name: wasm-artifacts-${{ github.sha }}
          path: lifebank-soroban/target/wasm32v1-none/release

      - name: Check lockfile has deployments
        id: check-lock
        run: |
          deployed=$(jq -r '.deployed_at // "null"' deployments/${{ matrix.network }}.json)
          if [ "$deployed" = "null" ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "No deployments recorded for ${{ matrix.network }} — skipping hash check."
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Verify WASM hashes against lockfile
        if: steps.check-lock.outputs.skip == 'false'
        run: |
          LOCKFILE="deployments/${{ matrix.network }}.json"
          WASM_DIR="target/wasm32v1-none/release"
          all_ok=true

          echo "Verifying against $LOCKFILE …"
          while IFS= read -r line; do
            contract=$(echo "$line" | jq -r '.key')
            locked_hash=$(echo "$line" | jq -r '.value.wasm_hash')
            [ "$locked_hash" = "null" ] && continue

            wasm_opt="${WASM_DIR}/${contract}_contract.optimized.wasm"
            wasm_raw="${WASM_DIR}/${contract}_contract.wasm"

            if [ -f "$wasm_opt" ]; then
              wasm_path="$wasm_opt"
            elif [ -f "$wasm_raw" ]; then
              wasm_path="$wasm_raw"
            else
              echo "::warning::No WASM found for $contract"
              continue
            fi

            built_hash=$(sha256sum "$wasm_path" | awk '{print $1}')

            if [ "$built_hash" = "$locked_hash" ]; then
              echo "  ✓ $contract — hash matches"
            else
              echo "::error::$contract HASH MISMATCH (lockfile: $locked_hash, built: $built_hash)"
              all_ok=false
            fi
          done < <(jq -c '.contracts | to_entries[]' "$LOCKFILE")

          $all_ok || exit 1
          echo "All hashes verified for ${{ matrix.network }}"

  # ── Job 4: Upgrade rehearsal ─────────────────────────────────────────────
  upgrade-rehearsal:
    name: Upgrade Rehearsal
    runs-on: ubuntu-latest
    needs: test
    defaults:
      run:
        working-directory: lifebank-soroban
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain (pinned)
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ env.RUST_VERSION }}
          targets: wasm32v1-none

      - name: Cache Cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            lifebank-soroban/target
          key: cargo-rehearsal-${{ env.RUST_VERSION }}-${{ hashFiles('lifebank-soroban/Cargo.lock') }}

      - name: Run upgrade rehearsal tests
        run: |
          cargo build --release --target wasm32v1-none \
            -p payment-contract -p coordinator-contract
          cargo test -p payment-contract -p coordinator-contract \
            --features upgrade-rehearsal upgrade_rehearsal || true
