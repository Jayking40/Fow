[package]
name = "healthchain"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib"]

[dependencies]
soroban-sdk = "22.0.0"

[dev-dependencies]
soroban-sdk = { version = "22.0.0", features = ["testutils"] }
# soroban-env-host 22.1.3 declares open-ended `ed25519-dalek = ">=2.0.0"` and
# `curve25519-dalek = ">=4.1.3"`. ed25519-dalek 3.0 / curve25519-dalek 5.0
# changed the `CryptoRng` trait bounds (now require `TryRng` / `DerefMut`), which
# the host's `with_test_prng` -> `SigningKey::generate` path no longer satisfies,
# so `cargo test` fails to compile `soroban-env-host`. These `=` pins keep the
# resolver on the last compatible majors; the committed Cargo.lock enforces it.
# NOTE: `cargo update` (unscoped) can still re-add 3.0/5.0 for env-host — if that
# happens, run:
#   cargo update -p ed25519-dalek@3.0.0 --precise 2.2.0
#   cargo update -p curve25519-dalek@5.0.0 --precise 4.1.3
ed25519-dalek = "=2.2.0"
curve25519-dalek = "=4.1.3"

[profile.release]
opt-level = "z"
overflow-checks = true
debug = 0
strip = "symbols"
debug-assertions = false
panic = "abort"
codegen-units = 1
lto = true

[profile.release-with-logs]
inherits = "release"
debug-assertions = true
